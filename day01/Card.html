<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            
            width: 300px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 8px 8px 8px 8px rgba(0, 0, 0,0 ), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            transition: transform 0.3s ease;
            margin: 100px;
        
        }
        .card:hover {
            transform: scale(1.05);

        }
        .img{
            width: 100%;
            height: auto;
            
        
        }
        .card h2{
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .card p{
            
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
        button{
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            background-color: black;
            color: white;

        }
        .btn-card{
            display: flex;
            justify-content: center;
            align-items: center;
        }



        img{
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="img">
            <img src="https://d32way8yqog2tv.cloudfront.net/2025/01/client-image-adding-banner.jpg" alt="sample">
        </div>
        <div class="card-content">
            <h2>Card Title</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem, atque soluta! Debitis esse commodi incidunt rerum aliquid quas eum tempore quibusdam, temporibus cupiditate assumenda nobis est beatae porro repellendus. Ut?</p>
            <div class="btn-card">
                <button>Learn More</button>
            </div>
            
        </div>
    </div>
    
</body>
</html>
