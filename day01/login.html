<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }
        body{
            display: flex;
            height: 100vh;
            overflow: hidden;

        }
        .left-section{
            flex: 1;
            background: linear-gradient(rgb(63, 212, 33),rgb(17, 145, 49));
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            
        }
        .left-section h1{

        }



        .left-section p{
            font-size: 1em;
            line-height: 1.5;
            opacity: 0.8;
        }
        .shapes{
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
            
        .shape {
            position: absolute;
            background: rgb(206, 206, 205,0.2);
            border-radius: 50px;
            transform: rotate(45deg);

        }
        .shep1{
            width: 400px;
            height: 50px;
            bottom: 50px;
            left: -20px;
        }
        .shep2{
            width: 250px;
            height: 50px;
            bottom: 50px;
            left: -20px;
        }
        .shep3{
            width: 100px;
            height: 50px;
            bottom: 50px;
            left: -20px;
        }
        .right{
            flex: 1;
            background: white;
            position: relative;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;

        }
        .form-group{
            position: relative;
            margin-bottom: 20px;
        }
        .form-group input{
            width: 100%;
            padding: 12px 40px;
            border: 1px solid white;
            border-radius: 25px;
            outline: none;
            background: whitesmoke;
        }
        .form-group .icon{
            position: absolute;
            left: 15px;
            top: 5px;
            transform: translateY(15%);
            color: antiquewhite;
        }
        
    </style>



</head>
<body>
    <div class="left-section">
        <h1>Welcome to Website</h1>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Ea explicabo, aspernatur esse, velit assumenda harum nam molestiae unde enim maxime doloremque, officia laboriosam id repudiandae itaque ex quidem asperiores ratione.

        </p>
        <div class="shapes">
            <div class="shape shep1"></div>
            <div class="shape shep2"></div>
            <div class="shape shep3"></div>




        </div>


    </div>
    <div class="right">
        <form>
            <div class="login-form">
                <h2> User Login </h2>
                <div class="form-group">
                    <span class="icon"><img width="25" height="25" src="https://img.icons8.com/ios-glyphs/100/user-male-circle.png" alt="user-male-circle"/></span>
                    <input type="text" placeholder="Enter Your Username">


                </div>
                <div class="form-group">
                    <snap class="icon"><img width="25" height="25" src="https://img.icons8.com/ios-glyphs/100/password--v1.png" alt="password--v1"/></snap>
                    <input type="password" placeholder="Enter Your Password">




                </div>
                <div class="option">
                    <label>
                        <input type="checkbox"> Remember
                    </label>
                    <a href="a">Forgot your password?</a>



                </div>




            </div>
        </form>






    </div>


    
</body>
</html>
